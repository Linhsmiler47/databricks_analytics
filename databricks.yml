# This is a Declarative Automation Bundle definition for my_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_project
  uuid: dd1fdbd6-3498-40cc-91db-d1915bf1d7e7

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use (nyctaxi demo + customers CDC case study — Pattern B, schema-per-env)
  schema:
    description: The schema to use
  ecomm_catalog:
    description: Catalog for the e-commerce project (Pattern A — catalog-per-environment, see docs/roadmap/phase-1-free-edition.md)

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-4c2ccca6-b3b8.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
      ecomm_catalog: ecomm_dev
  staging:
    # A shared, non-personal copy for integration testing before prod.
    # Uses 'mode: production' so resource names are NOT prefixed with a
    # username and schedules are NOT auto-paused — but it still targets
    # the "staging" schema, not "prod", so it's safe to break.
    mode: production
    workspace:
      host: https://dbc-4c2ccca6-b3b8.cloud.databricks.com
      root_path: /Workspace/Users/mychivodoi123@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: staging
      ecomm_catalog: ecomm_staging
    permissions:
      - user_name: mychivodoi123@gmail.com
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://dbc-4c2ccca6-b3b8.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mychivodoi123@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mychivodoi123@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
      ecomm_catalog: ecomm_prod
    permissions:
      - user_name: mychivodoi123@gmail.com
        level: CAN_MANAGE
